<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask 계산 결과</title>
</head>
<body>계산기</h1>
    <form action="/calc" method="post">
        <input type="text"  id="num1" placeholder="첫번째 수" name="num1">
        <input type="text"  id="opcode" placeholder="+ - * /" name="opcode">  
        <input type="text" id="num2" placeholder="두번째 수" name="num2">
        <button type="submit" id="plus">결과보기</button>
        <a href="/home">홈으로</a>
    </form>
      
    {{ render_html | default('') | safe }}

</body>
</html>
