<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-container h2 {
            margin-bottom: 20px;
        }

        .login-form { 
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-form input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .login-form button {
            width: 90%;
            padding: 8px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-form button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body> 
    <div class="login-container">
        <h2>로그인</h2>

        {% if login_failed %}
        <p style="color:red;">로그인에 실패했습니다. 아이디/비밀번호를 확인해주세요.</p>
        {% endif %}
        
        <form class="login-form" action="/login" method="POST"> 
            <input type="text" name="username" placeholder="아이디(이메일)" required>
            <input type="password" name="password" placeholder="비밀번호" required>
            <button type="submit">로그인</button>
        </form>

        {{ render_html | default('') | safe }}
        
    </div>
</body>
</html>
